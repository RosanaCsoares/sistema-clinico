<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SystemMed - Dados Clínicos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="card shadow-sm p-4 custom-card">
            <div class="text-center mb-4">
                <h2 class="text-primary fw-bold">SystemMed</h2>
                <p class="text-muted">Preencha a sua ficha clínica e gere o seu QR Code</p>
            </div>
            <form id="clinicoForm" novalidate>
                <h5 class="border-bottom pb-2 mt-2">1. Dados Pessoais</h5>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="nome" class="form-label">Nome</label>
                        <input type="text" class="form-control" id="nome" name="nome">
                    </div>
                    <div class="col-md-6">
                        <label for="sobrenome" class="form-label">Sobrenome</label>
                        <input type="text" class="form-control" id="sobrenome" name="sobrenome">
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-4">
                        <label for="rg" class="form-label">RG</label>
                        <input type="text" class="form-control" id="rg" name="rg">
                    </div>
                    <div class="col-md-4">
                        <label for="cpf" class="form-label">CPF</label>
                        <input type="text" class="form-control" id="cpf" name="cpf">
                    </div>
                    <div class="col-md-4">
                        <label for="dataNascimento" class="form-label">Data de Nasc.</label>
                        <input type="date" class="form-control" id="dataNascimento" name="dataNascimento">
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="sexo" class="form-label">Sexo</label>
                        <select class="form-select" id="sexo" name="sexo">
                            <option value="">Selecione...</option>
                            <option value="F">Feminino</option>
                            <option value="M">Masculino</option>
                        </select>
                    </div>
                </div>

                <h5 class="border-bottom pb-2 mt-4">2. Informações de Saúde</h5>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="tipoSanguineo" class="form-label">Tipo Sanguíneo</label>
                        <select class="form-select" id="tipoSanguineo" name="tipoSanguineo">
                            <option value="">Selecione...</option>
                            <option value="A+">A+</option>
                            <option value="O+">O+</option>
                            <option value="B+">B+</option>
                            <option value="AB+">AB+</option>
                            <option value="A-">A-</option>
                            <option value="O-">O-</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="alergias" class="form-label">Alergias</label>
                        <input type="text" class="form-control" id="alergias" name="alergias">
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="medicamentos" class="form-label">Medicamentos Utilizados</label>
                        <input type="text" class="form-control" id="medicamentos" name="medicamentos">
                    </div>
                    <div class="col-md-6">
                        <label for="doencas" class="form-label">Doenças Crônicas</label>
                        <input type="text" class="form-control" id="doencas" name="doencas">
                    </div>
                </div>
                <div class="mb-3">
                    <label for="cirurgias" class="form-label">Cirurgias Realizadas</label>
                    <input type="text" class="form-control" id="cirurgias" name="cirurgias">
                </div>

                <h5 class="border-bottom pb-2 mt-4">3. Emergência e Segurança</h5>
                <div class="row mb-3">
                    <div class="col-md-4">
                        <label for="contatoNome" class="form-label">Nome do Contato</label>
                        <input type="text" class="form-control" id="contatoNome" name="contatoNome">
                    </div>
                    <div class="col-md-4">
                        <label for="contatoTelefone" class="form-label">Telefone</label>
                        <input type="text" class="form-control" id="contatoTelefone" name="contatoTelefone">
                    </div>
                    <div class="col-md-4">
                        <label for="contatoEmail" class="form-label">E-mail do Contato</label>
                        <input type="email" class="form-control" id="contatoEmail" name="contatoEmail">
                    </div>
                </div>
                <div class="mb-4">
                    <label for="senhaPublica" class="form-label text-danger fw-bold">Senha de Acesso Público (Para o QR Code)</label>
                    <input type="password" class="form-control" id="senhaPublica" name="senhaPublica" placeholder="Ex: 12345">
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary">Salvar e Gerar QR Code</button>
                    <a href="cadastro_conta.html" class="btn btn-outline-secondary">Voltar para a Conta</a>
                </div>
            </form>
        </div>
    </div>
    <script src="https://unpkg.com/just-validate@latest/dist/just-validate.production.min.js"></script>
    <script src="js/cadastro_clinico.js"></script>
</body>
</html>
