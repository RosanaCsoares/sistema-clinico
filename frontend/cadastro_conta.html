<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SystemMed - Criar Conta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
    <div class="card shadow-sm p-4 custom-card login-card">
        <div class="text-center mb-4">
            <h2 class="text-primary fw-bold">SystemMed</h2>
            <p class="text-muted">Crie sua conta de acesso</p>
        </div>
        <form id="contaForm" novalidate>
            <div class="mb-3">
                <label for="email" class="form-label">E-mail</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="Digite seu e-mail">
            </div>
            <div class="mb-3">
                <label for="senha" class="form-label">Senha</label>
                <input type="password" class="form-control" id="senha" name="senha" placeholder="Crie uma senha">
            </div>
            <div class="mb-4">
                <label for="confirmaSenha" class="form-label">Confirmar Senha</label>
                <input type="password" class="form-control" id="confirmaSenha" name="confirmaSenha" placeholder="Repita a senha">
            </div>
            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary">Avançar para Dados Clínicos</button>
                <a href="index.html" class="btn btn-outline-secondary">Voltar ao Login</a>
            </div>
        </form>
    </div>
    <script src="https://unpkg.com/just-validate@latest/dist/just-validate.production.min.js"></script>
    <script src="js/cadastro_conta.js"></script>
</body>
</html>
