<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SystemMed - Meu Perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="card shadow-sm p-4 custom-card" style="max-width: 800px;">
            <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-4">
                <h3 class="text-primary fw-bold mb-0">SystemMed</h3>
                <a href="index.html" class="btn btn-sm btn-outline-secondary">Sair</a>
            </div>
            <div class="row">
                <div class="col-md-5 text-center border-end">
                    <h5>Seu QR Code</h5>
                    <div id="qrcode-container"></div>
                    <p class="small text-muted mt-2">Imprima e cole no seu crachá.</p>
                    <div class="mt-4 border p-2 bg-light rounded">
                        <span class="d-block small text-muted">Senha de Acesso Público:</span>
                        <strong>SuaSenha123</strong>
                        <span class="d-block small text-danger mt-1">(Não escreva isso no crachá)</span>
                    </div>
                </div>
                <div class="col-md-7 ps-md-4 mt-4 mt-md-0">
                    <h5 class="mb-3">Seu Cadastro Clínico Atual</h5>
                    <p class="mb-1"><strong>Nome:</strong> <span id="displayNome">Usuário Teste</span></p>
                    <p class="mb-1"><strong>Tipo Sanguíneo:</strong> O+</p>
                    <p class="mb-1"><strong>Alergias:</strong> Nenhuma</p>
                    <p class="mb-1"><strong>Medicamentos:</strong> Nenhum</p>
                    <hr>
                    <h6 class="fw-bold">Contato de Emergência</h6>
                    <p class="mb-1"><strong>Nome:</strong> Maria</p>
                    <p class="mb-1"><strong>Telefone:</strong> (11) 99999-9999</p>
                </div>
            </div>
            <div class="d-grid gap-2 mt-5">
                <button class="btn btn-outline-primary" id="btnCompartilhar">Copiar Link Público</button>
                <button class="btn btn-danger" id="btnApagarConta">Apagar Cadastro Completo</button>
            </div>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="js/perfil.js"></script>
</body>
</html>
